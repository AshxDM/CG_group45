<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="js/three.js"></script>
    <script src="js/OrbitControls.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/layout.css">

    <title>The Helmet Forge</title>
</head>

<body>

    <div id="main-container">
        <div id="welcome">
            <h1>THE HELMET FORGE</h1>
            <p>Craft, customise, and explore legendary helmets in 3D.</p>
            <p>Use your mouse to rotate, zoom, and inspect your creation.</p>
        </div>

        <div id="save-slots">
            <h2>SELECT SAVE SLOT</h2>
            <div class="slot-row">
                <div class="slot-box" onclick="loadSlot(1)">SLOT 1</div>
                <div class="slot-box" onclick="loadSlot(2)">SLOT 2</div>
                <div class="slot-box" onclick="loadSlot(3)">SLOT 3</div>
            </div>
            <p id="slot-message"></p>
        </div>
    </div>

    <script>
        function loadSlot(slot) {
            localStorage.setItem("helmetForgeSaveSlot", slot);
            const message = document.getElementById("slot-message");
            message.textContent = "Slot " + slot + " selected.";
            message.style.color = "#66ccff";
        }
    </script>

    <script type='x-shader/x-vertex' id='vertexShader'>
        attribute float alpha;
        varying float vAlpha;
        void main() {
            vAlpha = alpha;
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            gl_PointSize = 2.0;
            gl_Position = projectionMatrix * mvPosition;
        }
    </script>

    <script type='x-shader/x-fragment' id='fragmentShader'>
        uniform vec3 color;
        varying float vAlpha;
        void main() {
            gl_FragColor = vec4(color, vAlpha);
        }
    </script>

    <script src="Task3.1/animate.js"></script>
    <script src="Task3.1/build.js"></script>
    <script src="Task3.1/setup.js"></script>
    <script src="Task3.1/run.js"></script>

</body>

</html>
