<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>The Helmet Forge — Slots</title>
    <link rel="stylesheet" href="css/layout.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body>

    <div id="ui-panel" class="draggable">
        <h2>Save Slots</h2>

        <button onclick="selectSlot(1)">Slot 1</button>
        <button onclick="selectSlot(2)">Slot 2</button>
        <button onclick="selectSlot(3)">Slot 3</button>
    </div>

    <script>
        function makeDraggable(panel) {
            let x = 0, y = 0, down = false;
            panel.addEventListener("pointerdown", e => {
                down = true;
                x = e.clientX - panel.offsetLeft;
                y = e.clientY - panel.offsetTop;
                panel.style.cursor = "grabbing";
            });
            window.addEventListener("pointermove", e => {
                if (!down) return;
                panel.style.left = (e.clientX - x) + "px";
                panel.style.top = (e.clientY - y) + "px";
            });
            window.addEventListener("pointerup", () => {
                down = false;
                panel.style.cursor = "grab";
            });
        }

        makeDraggable(document.getElementById("ui-panel"));

        function selectSlot(n) {
            localStorage.setItem("activeSlot", n);
            window.location.href = "CreatorPage.html";
        }
    </script>

</body>

</html>
