<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
        }
    }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/layout.css">

    <title>The Helmet Forge</title>
</head>

<body>

    <div id="ui-panel">

        <div id="selectedPartLabel">No part selected</div>

        <label>Material</label>
        <div id="materialDropdown" class="dropdown">
            <div id="materialSelected" class="dropdown-selected">Default</div>
            <div id="materialList" class="dropdown-list">

                <div class="mat-option" data-mat="metal">
                    <img class="mat-thumb" src="materials/metal.jpg">
                    Metal
                </div>

                <div class="mat-option" data-mat="gold">
                    <img class="mat-thumb" src="materials/gold.jpg">
                    Gold
                </div>

                <div class="mat-option" data-mat="chrome">
                    <img class="mat-thumb" src="materials/chrome.jpg">
                    Chrome
                </div>

                <div class="mat-option" data-mat="carbon">
                    <img class="mat-thumb" src="materials/carbon.jpg">
                    Carbon Fiber
                </div>

                <div class="mat-option" data-mat="matte">
                    <img class="mat-thumb" src="materials/matte.jpg">
                    Matte
                </div>

                <div class="mat-option" data-mat="hologram">
                    <img class="mat-thumb" src="materials/hologram.jpg">
                    Hologram
                </div>

            </div>
        </div>

        <label>Color Overlay</label>
        <input type="color" id="colorPicker" value="#ffffff">

        <label>Scale Length (X)</label>
        <input type="range" id="scaleX" min="0.1" max="3" step="0.01" value="1">

        <label>Scale Width (Y)</label>
        <input type="range" id="scaleY" min="0.1" max="3" step="0.01" value="1">

        <label>Rotate X</label>
        <input type="range" id="rotX" min="-180" max="180" step="1" value="0">

        <label>Rotate Y</label>
        <input type="range" id="rotY" min="-180" max="180" step="1" value="0">

        <label>Rotate Z</label>
        <input type="range" id="rotZ" min="-180" max="180" step="1" value="0">

        <label>Extra Component</label>
        <select id="componentSelect">
            <option value="none">None</option>
            <option value="horns">Horns</option>
            <option value="crest">Crest</option>
            <option value="visor">Visor</option>
            <option value="spikes">Spikes</option>
        </select>

        <button id="saveBtn">Save Design</button>
        <button id="resetBtn">Reset to Default</button>
    </div>

    <script type="module" src="build.js"></script>

</body>

</html>
