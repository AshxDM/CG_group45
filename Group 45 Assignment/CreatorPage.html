<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
        }
    }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/layout.css">

    <title>The Helmet Forge</title>

    <style>
        #ui-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #00ffff;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
            color: #00ffff;
            width: 260px;
            backdrop-filter: blur(6px);
        }

        select,
        input[type="color"],
        button {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            background: #001f2f;
            color: #00ffff;
            border: 1px solid #00ffff;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
        }

        #resetBtn {
            background: #ff0044;
            color: white;
        }

        label {
            margin-top: 15px;
            display: block;
            font-size: 14px;
        }

        #selectedPartLabel {
            margin-top: 10px;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div id="ui-panel">
        <div id="selectedPartLabel">No part selected</div>

        <label>Material</label>
        <div id="materialDropdown" class="dropdown">
            <div id="materialSelected" class="dropdown-selected">Default</div>
            <div id="materialList" class="dropdown-list">
                <div class="mat-option" data-mat="default"><span class="mat-icon"
                        style="background:#ffffff"></span>Default</div>
                <div class="mat-option" data-mat="metal"><span class="mat-icon" style="background:#aaaaaa"></span>Metal
                </div>
                <div class="mat-option" data-mat="hologram"><span class="mat-icon"
                        style="background:#00ffff"></span>Hologram</div>
                <div class="mat-option" data-mat="matte"><span class="mat-icon" style="background:#555555"></span>Matte
                </div>
                <div class="mat-option" data-mat="gold"><span class="mat-icon" style="background:#ffd700"></span>Gold
                </div>
                <div class="mat-option" data-mat="chrome"><span class="mat-icon"
                        style="background:#e6e6e6"></span>Chrome</div>
                <div class="mat-option" data-mat="carbon"><span class="mat-icon"
                        style="background:#222222"></span>Carbon</div>
                <div class="mat-option" data-mat="rust"><span class="mat-icon" style="background:#8b3e2f"></span>Rusted
                </div>
            </div>
        </div>

        <label>Color Overlay</label>
        <input type="color" id="colorPicker" value="#ffffff">

        <label>Extra Component</label>
        <select id="componentSelect">
            <option value="none">None</option>
            <option value="horns">Horns</option>
            <option value="crest">Crest</option>
            <option value="visor">Visor</option>
            <option value="spikes">Spikes</option>
        </select>

        <button id="resetBtn">Reset to Default</button>
    </div>


    <script type="module" src="build.js"></script>

</body>

</html>
