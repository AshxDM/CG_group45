<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>The Helmet Forge — Menu</title>

    <link rel="stylesheet" href="css/layout.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">


    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

    <div id="loading-screen">
        <h1>THE HELMET FORGE</h1>
        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>
        <p id="loading-percent">0%</p>
    </div>

    <div id="menu">
        <div id="helmet-preview"></div>

        <h1>THE HELMET FORGE</h1>
        <button onclick="startLoading()">Enter</button>
    </div>

    <script type="module">
        import * as THREE from "three";
        import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

        let scene, camera, renderer, helmetModel;

        function initMenuHelmet() {
            const container = document.getElementById("helmet-preview");

            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(
                45,
                container.clientWidth / container.clientHeight,
                0.01,
                5000
            );
            camera.position.set(0, 0, 5);

            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambient);

            const dir = new THREE.DirectionalLight(0xffffff, 2);
            dir.position.set(5, 5, 5);
            scene.add(dir);

            const loader = new GLTFLoader();
            loader.load(
                "./models/viking_helmet.glb",
                (gltf) => {
                    helmetModel = gltf.scene;

                    const box = new THREE.Box3().setFromObject(helmetModel);
                    const center = box.getCenter(new THREE.Vector3());
                    helmetModel.position.sub(center);

                    const size = box.getSize(new THREE.Vector3()).length();
                    const scaleFactor = 2 / size;
                    helmetModel.scale.setScalar(scaleFactor * 2.5);

                    helmetModel.traverse((child) => {
                        if (child.isMesh) {
                            child.material = new THREE.MeshPhongMaterial({
                                color: 0x00ffff,
                                emissive: 0x00ffff,
                                emissiveIntensity: 1.5,
                                transparent: true,
                                opacity: 0.35,
                                shininess: 200
                            });
                        }
                    });

                    scene.add(helmetModel);
                    animateMenuHelmet();
                },
                undefined,
                (error) => {
                    console.error("GLB failed to load:", error);
                }
            );
        }

        function animateMenuHelmet() {
            requestAnimationFrame(animateMenuHelmet);

            if (helmetModel) {
                helmetModel.rotation.y += 0.01;

                helmetModel.traverse((child) => {
                    if (child.isMesh) {
                        child.material.opacity = 0.25 + Math.sin(Date.now() * 0.003) * 0.1;
                    }
                });
            }

            renderer.render(scene, camera);
        }

        window.addEventListener("load", initMenuHelmet);

        window.startLoading = function () {
            const loader = document.getElementById("loading-screen");
            const menu = document.getElementById("menu");

            menu.style.opacity = "0";
            menu.style.pointerEvents = "none";

            setTimeout(() => {
                loader.classList.add("visible");
            }, 300);

            let progress = 0;
            const bar = document.getElementById("progress-bar");
            const percent = document.getElementById("loading-percent");

            const interval = setInterval(() => {
                progress += 2;
                bar.style.width = progress + "%";
                percent.textContent = progress + "%";

                if (progress >= 100) {
                    clearInterval(interval);

                    loader.classList.remove("visible");
                    loader.classList.add("fade-out");

                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 900);
                }
            }, 40);
        };
    </script>

</body>

</html>
