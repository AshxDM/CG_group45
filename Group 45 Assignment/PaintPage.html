<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>The Helmet Forge — Paint Mode</title>

    <link rel="stylesheet" href="css/layout.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

    <div id="ui-panel" class="draggable">
        <h2>Paint Mode</h2>

        <label>Brush Color</label>
        <input type="color" id="colorPicker" value="#ff0000">

        <label>Brush Size</label>
        <input type="range" id="brushSize" min="5" max="80" value="20">

        <button id="returnBtn">Return to Creator</button>
    </div>

    <script>
        function makeDraggable(panel) {
            let x = 0, y = 0, down = false;
            panel.addEventListener("pointerdown", e => {
                down = true;
                x = e.clientX - panel.offsetLeft;
                y = e.clientY - panel.offsetTop;
                panel.style.cursor = "grabbing";
            });
            window.addEventListener("pointermove", e => {
                if (!down) return;
                panel.style.left = (e.clientX - x) + "px";
                panel.style.top = (e.clientY - y) + "px";
            });
            window.addEventListener("pointerup", () => {
                down = false;
                panel.style.cursor = "grab";
            });
        }

        makeDraggable(document.getElementById("ui-panel"));
    </script>

    <script type="module" src="paint.js"></script>
</body>

</html>
